<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sensei Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14B8A6">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sensei">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // Apply the saved theme before the page draws (no white flash). No saved choice: follow the system setting.
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem("sensei-theme")); } catch (e) {}
    if (t !== "dark" && t !== "light") {
      t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="app.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 960px;
    height: 100vh;
    height: 100dvh;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    scroll-behavior: smooth;
  }

  /* Greeting */
  .hello { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .hello h1 { margin: 0; font-size: 28px; font-weight: 700; }
  .hello p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

  /* Section titles */
  h2 { margin: 0 0 12px; font-size: 18px; font-weight: 700; }

  /* Stat cards */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .stat .icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--teal-soft);
    color: var(--accent-text);
    display: grid; place-items: center;
    margin-bottom: 6px;
  }
  .stat .icon svg { width: 20px; height: 20px; }
  .stat .value { font-size: 32px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .label { font-size: 14px; font-weight: 600; }
  .stat .sub { font-size: 13px; color: var(--muted); }
  @media (max-width: 480px) {
    .stats { gap: 8px; }
    .stat { padding: 12px 10px; border-radius: 14px; }
    .stat .icon { width: 30px; height: 30px; margin-bottom: 2px; }
    .stat .value { font-size: 26px; }
    .stat .label { font-size: 12px; }
    .stat .sub { font-size: 11px; }
  }

  /* Continue learning */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .action {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    border-radius: 18px;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    transition: background .15s, border-color .15s;
  }
  .action svg { width: 24px; height: 24px; flex-shrink: 0; }
  .action .arrow { margin-left: auto; width: 18px; height: 18px; }
  .action.primary { background: var(--teal); color: #fff; }
  .action.primary:hover { background: var(--teal-dark); }
  .action.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .action.secondary:hover { border-color: var(--teal); background: var(--teal-soft); }
  @media (max-width: 480px) { .actions { grid-template-columns: 1fr; } }

  /* Progress chart */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px 16px;
  }
  .chart-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
  }
  .chart-head h2 { margin: 0; }
  .chart-head span { font-size: 14px; color: var(--muted); }
  .bars { display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; }
  .bar-row {
    display: grid;
    grid-template-columns: 90px 1fr 48px;
    align-items: center;
    gap: 12px;
  }
  .bar-row .name { font-size: 15px; font-weight: 600; }
  .bar-row .count { font-size: 14px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .track {
    position: relative;
    height: 14px;
    background: var(--track);
    border-radius: 4px;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0;
    background: var(--teal);
    border-radius: 4px;
    transition: width .6s ease;
  }
  .bar-row:hover .track { outline: 2px solid var(--teal-soft); outline-offset: 2px; }
  .empty-note { margin: 14px 0 0; font-size: 14px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .fill { transition: none; }
    main { scroll-behavior: auto; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="appnav" aria-label="Main">
    <a href="dashboard.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Dashboard
    </a>
    <a href="vocab.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 2h12a2 2 0 0 1 2 2v12"/></svg>
      Vocab
    </a>
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      Practice
    </a>
    <a href="dashboard.html#progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
      Progress
    </a>
  </nav>

  <main>
    <section class="hello">
      <div>
        <h1>Welcome back! 👋</h1>
        <p id="today"></p>
      </div>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </section>

    <section class="stats" aria-label="Your stats">
      <div class="stat">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>
        <div class="value" id="wordsLearned">0</div>
        <div class="label">Words Learned</div>
        <div class="sub" id="wordsSub"></div>
      </div>
      <div class="stat">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></div>
        <div class="value" id="conversations">0</div>
        <div class="label">Conversations</div>
        <div class="sub">with Sensei</div>
      </div>
      <div class="stat">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5.5C10 9.5 11 11 12 11c0-3-1-6 0-9z"/></svg></div>
        <div class="value" id="streak">0</div>
        <div class="label">Day Streak</div>
        <div class="sub" id="streakSub"></div>
      </div>
    </section>

    <section>
      <h2>Continue Learning</h2>
      <div class="actions">
        <a class="action primary" href="vocab.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 2h12a2 2 0 0 1 2 2v12"/></svg>
          Practice Vocabulary
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </a>
        <a class="action secondary" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
          Chat with Sensei
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </section>

    <section class="card" id="progress">
      <div class="chart-head">
        <h2>Your Progress</h2>
        <span id="overall"></span>
      </div>
      <ul class="bars" id="bars"></ul>
      <p class="empty-note" id="emptyNote" hidden>No words learned yet. Open Vocabulary and tap “Know It ✓” to fill these bars.</p>
    </section>
  </main>
</div>

<script src="app.js"></script>
<script>
function render() {
  document.getElementById("today").textContent = new Date().toLocaleDateString("en-US", {
    weekday: "long", month: "long", day: "numeric", year: "numeric",
  });

  const stats = topicStats();
  const known = stats.reduce((s, t) => s + t.known, 0);
  const total = stats.reduce((s, t) => s + t.total, 0);

  document.getElementById("wordsLearned").textContent = known;
  document.getElementById("wordsSub").textContent = `of ${total} words`;

  document.getElementById("conversations").textContent = Number(Store.get(KEYS.conversations, 0)) || 0;

  const streak = dayStreak();
  document.getElementById("streak").textContent = streak;
  document.getElementById("streakSub").textContent =
    streak === 0 ? "Start today!" : streak === 1 ? "day — keep going!" : "days in a row";

  document.getElementById("overall").textContent = `${Math.round(total ? known / total * 100 : 0)}% overall`;

  const bars = document.getElementById("bars");
  bars.innerHTML = "";
  stats.forEach(t => {
    const pct = t.total ? t.known / t.total * 100 : 0;
    const li = document.createElement("li");
    li.className = "bar-row";
    li.title = `${t.name}: ${t.known} of ${t.total} words learned (${Math.round(pct)}%)`;
    li.innerHTML = `
      <span class="name">${t.name}</span>
      <div class="track" role="progressbar" aria-label="${t.name}" aria-valuemin="0" aria-valuemax="${t.total}" aria-valuenow="${t.known}" aria-valuetext="${t.known} of ${t.total} words learned">
        <div class="fill"></div>
      </div>
      <span class="count">${t.known}/${t.total}</span>`;
    bars.appendChild(li);
    // set width on the next frame so the bar animates in
    requestAnimationFrame(() => { li.querySelector(".fill").style.width = pct + "%"; });
  });
  document.getElementById("emptyNote").hidden = known > 0;
}

render();
// Refresh numbers when coming back with the browser's Back button.
window.addEventListener("pageshow", e => { if (e.persisted) render(); });
</script>
</body>
</html>
