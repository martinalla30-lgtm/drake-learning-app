<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sensei English Chat</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14B8A6">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sensei">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // Apply the saved theme before the page draws (no white flash). No saved choice: follow the system setting.
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem("sensei-theme")); } catch (e) {}
    if (t !== "dark" && t !== "light") {
      t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 720px;
    height: 100vh;
    height: 100dvh;
    background: var(--bg);
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--teal);
    color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 18px;
    flex-shrink: 0;
  }
  .who { flex: 1; min-width: 0; }
  .who h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--online); }
  .new-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--accent-text);
    font-weight: 600;
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .new-btn:hover { background: var(--teal-soft); border-color: var(--teal); }

  /* Messages */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.ai { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    line-height: 1.45;
    font-size: 16px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--teal);
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .row.ai .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
  }
  .row.error .bubble {
    background: var(--err-bg);
    border: 1px solid var(--err-border);
    color: var(--err-text);
    font-size: 14px;
  }
  .retry {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .retry:hover { background: var(--teal-dark); }
  .retry svg { width: 15px; height: 15px; }
  .typing.slow .label { color: var(--accent-text); font-weight: 600; }

  /* Typing indicator */
  .typing { display: flex; align-items: center; gap: 8px; }
  .typing .label { font-size: 13px; color: var(--muted); }
  .dots { display: flex; gap: 4px; }
  .dots span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Starters */
  .starters {
    margin: auto 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
  }
  .starters p { margin: 0 0 4px; color: var(--muted); font-size: 14px; text-align: center; }
  .starter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
  }
  .starter {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    font-size: 15px;
    text-align: left;
    color: var(--text);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .starter:hover { border-color: var(--teal); background: var(--teal-soft); }
  .starter.suggested { border-color: var(--teal); background: var(--teal-soft); }
  .starter .tag {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-text);
  }
  @media (max-width: 420px) { .starter-grid { grid-template-columns: 1fr; } }

  /* Composer */
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 12px 16px;
    font-size: 16px;
    outline: none;
    background: var(--bg);
  }
  #input:focus { border-color: var(--teal); background: var(--surface); }
  #send {
    display: flex; align-items: center; gap: 6px;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:hover { background: var(--teal-dark); }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  #send svg { width: 18px; height: 18px; }

  /* On mobile the bottom tab bar handles the safe area instead of the form. */
  @media (max-width: 640px) {
    form { padding-bottom: 12px; }
  }
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" aria-hidden="true">S</div>
    <div class="who">
      <h1>Sensei</h1>
      <div class="status"><span class="dot"></span>Online</div>
    </div>
    <button class="new-btn" id="newChat" type="button">New Conversation</button>
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <form id="composer" autocomplete="off">
    <input id="input" type="text" placeholder="Type your message in English..." aria-label="Message">
    <button id="send" type="submit">
      Send
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
      </svg>
    </button>
  </form>

  <nav class="appnav" aria-label="Main">
    <a href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Dashboard
    </a>
    <a href="vocab.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 2h12a2 2 0 0 1 2 2v12"/></svg>
      Vocab
    </a>
    <a href="index.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
      Practice
    </a>
    <a href="dashboard.html#progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
      Progress
    </a>
  </nav>
</div>

<script src="app.js"></script>
<script>
// Default starters. `topic` links a starter to a vocab topic so it can be swapped out.
const DEFAULT_STARTERS = [
  { text: "Tell me about your day", topic: null },
  { text: "Let's practice ordering food", topic: "Food" },
  { text: "Help me introduce myself", topic: "Greetings" },
  { text: "I need travel phrases", topic: "Travel" },
];

// Shown first when the student recently studied that topic's vocab cards.
const TOPIC_STARTERS = {
  Food: "Let's practice ordering at a restaurant.",
  Travel: "Plan a trip with me in English.",
  Greetings: "Let's practice meeting someone new.",
  Business: "Let's practice a business meeting.",
};

function getStarters() {
  const topic = recentTopic(); // from app.js: last studied topic, within 7 days
  if (!topic || !TOPIC_STARTERS[topic]) return DEFAULT_STARTERS;
  const others = DEFAULT_STARTERS.filter(s => s.topic !== topic).slice(0, 3);
  return [{ text: TOPIC_STARTERS[topic], topic, suggested: true }, ...others];
}

const chat = document.getElementById("chat");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const newChatBtn = document.getElementById("newChat");

// Conversation so far, as plain text: [{ role: "user" | "assistant", content: "..." }].
// Sent to our own server (/api/chat), which adds the system prompt and calls the AI.
let history = [];
let busy = false;

function scrollToBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function addBubble(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollToBottom();
  return row;
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "row ai";
  row.id = "typing";
  row.innerHTML = '<div class="bubble typing"><div class="dots"><span></span><span></span><span></span></div><span class="label">typing...</span></div>';
  chat.appendChild(row);
  scrollToBottom();
}

function hideTyping() {
  const t = document.getElementById("typing");
  if (t) t.remove();
}

function renderStarters() {
  chat.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "starters";
  wrap.id = "starters";
  wrap.innerHTML = "<p>Hi! I'm Sensei, your English teacher. Pick a topic or write your own message.</p>";
  const grid = document.createElement("div");
  grid.className = "starter-grid";
  getStarters().forEach(s => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "starter" + (s.suggested ? " suggested" : "");
    if (s.suggested) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = `✨ Based on your ${s.topic} practice`;
      b.appendChild(tag);
    }
    b.appendChild(document.createTextNode(s.text));
    b.addEventListener("click", () => sendMessage(s.text));
    grid.appendChild(b);
  });
  wrap.appendChild(grid);
  chat.appendChild(wrap);
}

function setBusy(value) {
  busy = value;
  sendBtn.disabled = value;
}

// Calls our Vercel function. No API key here — it lives on the server.
async function callSensei(message, signal) {
  const res = await fetch("/api/chat", {
    method: "POST",
    signal,
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ message, history }),
  });

  const data = await res.json().catch(() => null);
  if (!res.ok || !data) {
    throw new Error(data && data.error ? data.error : "Sensei could not be reached (" + res.status + ").");
  }
  return data; // { reply: "..." } or { refusal: true }
}

const SLOW_AFTER_MS = 10000;    // show "thinking extra hard"
const TIMEOUT_AFTER_MS = 20000; // give up and offer Retry

// Error bubble with a Retry button that sends the same message again.
function addRetryError(message, text) {
  const row = addBubble("error", message);
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "retry";
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>Retry';
  btn.addEventListener("click", () => {
    if (busy) return;
    row.remove();
    sendMessage(text, { retry: true });
  });
  row.querySelector(".bubble").appendChild(document.createElement("br"));
  row.querySelector(".bubble").appendChild(btn);
  scrollToBottom();
}

async function sendMessage(text, { retry = false } = {}) {
  text = text.trim();
  if (!text || busy) return;

  const starters = document.getElementById("starters");
  if (starters) starters.remove();

  // On retry the student's bubble is already on screen, so don't add it again.
  if (!retry) {
    addBubble("user", text);
    input.value = "";
  }
  setBusy(true);
  showTyping();

  const controller = new AbortController();
  let timedOut = false;
  const slowTimer = setTimeout(() => {
    const typing = document.querySelector("#typing .typing");
    if (typing) {
      typing.classList.add("slow");
      typing.querySelector(".label").textContent = "Sensei is thinking extra hard! Please wait...";
      scrollToBottom();
    }
  }, SLOW_AFTER_MS);
  const timeoutTimer = setTimeout(() => {
    timedOut = true;
    controller.abort();
  }, TIMEOUT_AFTER_MS);

  try {
    const data = await callSensei(text, controller.signal);
    hideTyping();

    if (data.refusal) {
      addBubble("error", "Sorry, I can't answer that. Let's try another topic!");
      return;
    }

    const reply = typeof data.reply === "string" && data.reply ? data.reply : "…";

    // Only add the turn to the history once Sensei has answered.
    history.push({ role: "user", content: text });
    history.push({ role: "assistant", content: reply });
    addBubble("ai", reply);

    // Stats for the dashboard: a conversation counts once Sensei has replied to its first message.
    recordActivity();
    if (history.length === 2) countConversation();
  } catch (err) {
    hideTyping();
    if (timedOut) {
      addRetryError("Something went wrong. Let's try again.", text);
    } else if (!navigator.onLine) {
      addRetryError("You are offline. Connect to the internet to chat with Sensei.", text);
    } else {
      addRetryError(err.message, text);
    }
  } finally {
    clearTimeout(slowTimer);
    clearTimeout(timeoutTimer);
    setBusy(false);
    input.focus();
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  sendMessage(input.value);
});

newChatBtn.addEventListener("click", () => {
  if (busy) return;
  history = [];
  input.value = "";
  renderStarters();
  input.focus();
});

renderStarters();

// Coming back with the Back button (e.g. from the vocab page): refresh suggestions if the chat is still empty.
window.addEventListener("pageshow", e => {
  if (e.persisted && history.length === 0) renderStarters();
});
</script>
</body>
</html>
